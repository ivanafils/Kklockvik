<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skuggorna över Klockvik</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#233047;background:#f3f0e9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:790px;margin:auto;padding:20px}.hero{background:#22344d;color:white;border-radius:20px;padding:24px;margin:14px 0 20px}.hero h1{font-family:Georgia,serif;margin:4px 0;font-size:clamp(27px,5vw,42px)}.tag{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:#cbd6e5}.card{background:white;border-radius:18px;padding:clamp(20px,5vw,35px);box-shadow:0 5px 22px #23304712}.progress{display:flex;gap:7px;margin:18px 0}.progress span{height:8px;flex:1;border-radius:9px;background:#d7dce2}.progress span.done{background:#5a9a82}h2{font-family:Georgia,serif;font-size:29px;margin:0 0 20px}.story{font-family:Georgia,serif;font-size:clamp(18px,3vw,21px);line-height:1.75}.story p{margin:0 0 16px}.story em{color:#3d506b}.divider{border:0;border-top:1px solid #e3e5e8;margin:26px 0}button{font:inherit;cursor:pointer;border-radius:12px;padding:13px 17px;border:2px solid #cbd4df;background:#fff;color:#233047;text-align:left}button:hover{border-color:#557da1}button:focus-visible{outline:3px solid #f2bd53;outline-offset:2px}.options{display:grid;gap:10px}.options button.selected{background:#e8f0f8;border-color:#315d85}.primary{display:block;width:100%;margin-top:18px;text-align:center;background:#284f75;color:#fff;border-color:#284f75;font-weight:700}.primary:disabled{opacity:.4;cursor:not-allowed}.feedback{margin-top:12px;padding:12px;border-radius:10px;background:#fff2dc}.feedback.good{background:#e2f3e8}.small{font-size:14px;color:#657084}.chapter-end{text-align:center;padding:25px 0}.chapter-end .star{font-size:46px}footer{text-align:center;padding:24px;font-size:13px;color:#68717c}</style></head><body><main class="wrap"><header class="hero"><div class="tag">Ett läsäventyr för årskurs 2</div><h1>Skuggorna över Klockvik</h1><div>Kapitel 1 · Klockan som gick baklänges</div></header><div class="progress" id="progress" aria-label="Framsteg"></div><section class="card" id="app" aria-live="polite"></section><footer>En läsupplevelse där du löser mysteriet med hjälp av texten.</footer></main><script>
const parts=[
{title:'Staden Klockvik',paras:[`Det var något konstigt med Klockvik.`,`Inte så att staden såg konstig ut. Tvärtom! Husen var målade i gult, rosa och blått. På torget stod en fontän med en fisk som sprutade vatten ur munnen. Och från bageriet på hörnet luktade det nybakade kanelbullar.`,`Varje morgon öppnade bagaren Mira sitt bageri när den stora klockan i tornet slog sju. Då började staden vakna. Cyklar rullade över kullerstenarna och affärerna öppnade sina dörrar.`,`Men den här morgonen skulle inte bli som alla andra.`],qs:[['Var stod fontänen?',['Mitt på torget','I skogen','Bakom skolan'],0],['Vad luktade det från bageriet?',['Nygräddad pizza','Nybakade kanelbullar','Varm choklad'],1],['När brukade Mira öppna bageriet?',['När klockan slog fem','När klockan slog sju','När klockan slog nio'],1]]},
{title:'Sam och Noor',paras:[`På andra sidan torget kom två barn gående. Det var Sam och Noor. De hade känt varandra så länge de kunde minnas.`,`Sam hade alltid fickorna fulla av saker. Skruvar, snören, stenar och annat som kunde vara bra att ha. I dag hade han också en liten ficklampa.`,`Noor tyckte om ordning och reda. I sin röda ryggsäck hade hon en anteckningsbok där hon skrev ner allt som verkade misstänkt.`,`– Varför har du ficklampan med dig? frågade Noor.`,`– Man vet aldrig när det blir mörkt, svarade Sam.`,`– Det är mitt på morgonen, sa Noor och log.`],qs:[['Vad hade Sam med sig?',['En ficklampa','En kikare','En kamera'],0],['Vilken färg hade Noors ryggsäck?',['Blå','Grön','Röd'],2],['Vad skrev Noor i sin anteckningsbok?',['Recept','Saker som verkade misstänkta','Sånger'],1]]},
{title:'Något är fel',paras:[`Plötsligt hördes ett dån över torget.`,`– DONG! DONG! DONG!`,`Den stora klockan slog tre slag.`,`– Tre? sa bagaren Mira och stack ut huvudet genom dörren. Har jag försovit mig eller har klockan blivit tokig?`,`– Hör du? viskade Noor.`,`– Vadå? frågade Sam.`,`– Det tickar inte.`,`Sam stannade. Hon hade rätt. Klockan i tornet var alldeles tyst.`,`Plötsligt ryckte den stora visaren till. Sedan började den röra sig baklänges!`,`– Det där är inte normalt, sa Sam.`,`– Vilken tur att du sa det, svarade Noor och himlade med ögonen.`],qs:[['Hur många slag slog klockan?',['Två','Tre','Sju'],1],['Vad hände med klockans visare?',['Den föll ner','Den började röra sig baklänges','Den blev blå'],1],['Vem stack ut huvudet från bageriet?',['Mira','Noor','Sam'],0]]},
{title:'Det mystiska kuvertet',paras:[`Just då flög något vitt genom luften. Ett kuvert landade mitt framför deras fötter.`,`På framsidan fanns en silverfärgad stjärna. Noor böjde sig ner och plockade upp det.`,`– Det står något här!`,`Med små, sneda bokstäver stod det:`,`”Till den som vågar ta reda på sanningen.”`,`Sam svalde.`,`– Tror du att det är till oss?`,`Innan Noor hann svara hördes ett högt brak från klocktornet.`,`– KRASCH!`,`Alla på torget vände sig om. Högt uppe i tornets fönster syntes en mörk skugga. Den rörde sig. Sedan försvann den.`,`Noor tittade på Sam. Sam tittade på Noor.`,`– Vi måste ta reda på vad som händer, sa Noor.`,`Men det fanns en sak som de inte visste. Någon inne i tornet hade redan fått syn på dem.`],qs:[['Vad fanns på kuvertet?',['En silverfärgad stjärna','En gul sol','Ett rött hjärta'],0],['Var syntes den mörka skuggan?',['I fontänen','I bageriet','I tornets fönster'],2],['Vad stod det på kuvertet?',['Till den som vågar ta reda på sanningen','Kom till bageriet klockan åtta','Öppna inte dörren'],0]]}
];let part=0,question=0,selected=-1,phase='read';const app=document.getElementById('app');const progress=document.getElementById('progress');function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function btn(txt,cls,fn){const b=el('button',cls,txt);b.type='button';b.onclick=fn;return b}function render(){app.replaceChildren();progress.replaceChildren();for(let i=0;i<parts.length;i++){const s=el('span',i<=part?'done':'');progress.append(s)}if(phase==='end'){const d=el('div','chapter-end');d.append(el('div','star','★'),el('h2','', 'Kapitel 1 avklarat!'),el('p','','Du har löst alla läsfrågor. Men vem gömmer sig i klocktornet? Fortsättning följer ...'),btn('Läs kapitlet igen','primary',()=>{part=0;question=0;phase='read';render()}));app.append(d);return}app.append(el('div','small',`Kapitel 1 · Del ${part+1} av 4`),el('h2','',parts[part].title));if(phase==='read'){const story=el('div','story');parts[part].paras.forEach(t=>story.append(el('p','',t)));app.append(story,btn('Svara på frågor →','primary',()=>{phase='quiz';question=0;selected=-1;render()}));return}const q=parts[part].qs[question];app.append(el('hr','divider'),el('div','small',`Fråga ${question+1} av ${parts[part].qs.length} · Hitta svaret i texten`),el('h3','',q[0]));const options=el('div','options');q[1].forEach((t,i)=>options.append(btn(t,selected===i?'selected':'',()=>{selected=i;render()})));app.append(options);if(selected>=0){const correct=selected===q[2];app.append(el('div',correct?'feedback good':'feedback',correct?'Rätt! Du hittade svaret i texten.':'Inte riktigt. Läs delen igen och försök på nytt.'));if(correct){app.append(btn(question<2?'Nästa fråga →':part<3?'Nästa del →':'Avsluta kapitel 1 ★','primary',()=>{if(question<2){question++;selected=-1}else if(part<3){part++;phase='read';question=0;selected=-1}else phase='end';render();window.scrollTo({top:0,behavior:'smooth'})}))}else app.append(btn('Läs texten igen','primary',()=>{phase='read';selected=-1;render()}))}else{const b=btn('Kontrollera svar','primary',()=>{});b.disabled=true;app.append(b)} }render();
</script></body></html>
